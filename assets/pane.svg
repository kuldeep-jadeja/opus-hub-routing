    <text x="48" y="248"><tspan fill="#5b566e">├─ </tspan><tspan fill="#5be39a">✓ </tspan><tspan fill="#ffffff" font-weight="700">research-scout</tspan><tspan fill="#5be39a"> haiku</tspan><tspan fill="#5b566e">/low · 9s · 6.0k tok · $0.0040</tspan></text>
    <text x="48" y="270" fill="#5b566e">│  Find where sessions are stored</text>

    <text x="48" y="302"><tspan fill="#5b566e">├─ </tspan><tspan fill="#5be39a">✓ </tspan><tspan fill="#ffffff" font-weight="700">sonnet-builder</tspan><tspan fill="#6fb3ff"> sonnet</tspan><tspan fill="#5b566e">/default · 1m12s · 31.4k tok · $0.12</tspan></text>
    <text x="48" y="324" fill="#5b566e">│  Fix token expiry check in auth middleware</text>

    <text x="48" y="356"><tspan fill="#5b566e">├─ </tspan><tspan fill="#ff6b6b">✗ </tspan><tspan fill="#ffffff" font-weight="700">sonnet-builder</tspan><tspan fill="#6fb3ff"> sonnet</tspan><tspan fill="#ffcc4d"> (override dropped)</tspan><tspan fill="#5b566e"> · 20s</tspan></text>
    <text x="48" y="378" fill="#5b566e">│  Add tests for refresh flow</text>

    <text x="48" y="410"><tspan fill="#5b566e">└─ </tspan><tspan fill="#ffcc4d">● </tspan><tspan fill="#ffffff" font-weight="700">opus-reviewer</tspan><tspan fill="#d98cff"> opus</tspan><tspan fill="#5b566e">/default · Read</tspan></text>
    <text x="75" y="432" fill="#5b566e">Review auth middleware fix</text>
  </g>
